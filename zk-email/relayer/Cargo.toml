[package]
name = "zk-email-relayer"
version = "1.0.0"
edition = "2021"
authors = ["Scientific Vote Core Architecture Team"]

[dependencies]
actix-web = "4.4"
actix-cors = "0.7"
tokio = { version = "1.36", features = ["full"] }
futures-util = "0.3"
async-stream = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hickory-resolver = { version = "0.24", features = ["dnssec-ring"] }
sha2 = "0.10"
rsa = "0.9"
hex = "0.4"
base64 = "0.21"
tracing = "0.1"
tracing-subscriber = "0.3"
