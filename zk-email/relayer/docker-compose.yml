version: '3.8'

services:
  zk-email-broker:
    build:
      context: .
      dockerfile: Dockerfile
    image: soonami4good/zk-email-relayer:1.0.0
    container_name: zk-email-broker
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - RUST_LOG=info
      - WORKER_SECRET=${WORKER_SECRET:-soonami_production_secret_key_2026}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/api/v1/dnssec/snapshot/mit.edu/google || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Self-Hosted Kubo IPFS Daemon (Zero Third-Party SaaS Cost)
  ipfs-node:
    image: ipfs/kubo:v0.29.0
    container_name: zk-ipfs-node
    restart: unless-stopped
    ports:
      - "4001:4001"           # P2P Swarm listening port (TCP/QUIC)
      - "4001:4001/udp"       # P2P Swarm listening port (UDP QUIC)
      - "127.0.0.1:5001:5001" # IPFS RPC API (Bound to localhost only for security)
      - "127.0.0.1:8080:8080" # Local Gateway HTTP (Bound to localhost)
    volumes:
      - ipfs-staging:/export
      - ipfs-data:/data/ipfs
    environment:
      - IPFS_PATH=/data/ipfs
      - LIBP2P_FORCE_PNET=0

volumes:
  ipfs-staging:
  ipfs-data:

